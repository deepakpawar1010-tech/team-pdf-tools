<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team PDF Tools</title><style>
:root{--ink:#172235;--muted:#687386;--red:#ef3e39;--bg:#f4f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}header{height:70px;background:#fff;border-bottom:1px solid #dce1e8;display:flex;align-items:center;padding:0 6vw;gap:35px}.brand{font-size:25px;font-weight:800}.brand b{color:var(--red)}nav{display:flex;gap:25px}nav button{border:0;background:none;font-weight:700;padding:25px 0;color:var(--muted);cursor:pointer}nav button.active{color:var(--red);border-bottom:3px solid var(--red)}main{width:min(1100px,92vw);margin:auto}.hero{text-align:center;padding:70px 0 35px}.hero h1{font-size:clamp(40px,6vw,70px);letter-spacing:-3px;margin:0}.hero em{color:var(--red);font-family:Georgia,serif;font-weight:400}.hero p{color:var(--muted);font-size:17px;line-height:1.5;max-width:660px;margin:20px auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.tile,.panel{background:#fff;border:1px solid #d7dce5;border-radius:16px}.tile{padding:28px;text-align:left;cursor:pointer;min-height:220px}.tile:hover{box-shadow:0 16px 30px #18223715;transform:translateY(-3px)}.icon{display:grid;place-items:center;background:#ffe4de;color:var(--red);border-radius:10px;width:48px;height:48px;font-size:24px;font-weight:800}.tile h2{margin:20px 0 8px}.tile p{color:var(--muted);line-height:1.5}.panel{padding:32px;margin:45px auto 70px;max-width:760px}.panel h2{margin-top:0}.drop{display:block;border:1.5px dashed #aeb8c7;border-radius:12px;padding:32px;text-align:center;color:var(--muted);cursor:pointer}.drop input{display:none}.range{display:flex;gap:10px;align-items:center;margin:18px 0}.range input,.panel select{padding:10px;border:1px solid #bcc6d4;border-radius:7px;width:90px}.panel select{width:100%}.primary{border:0;border-radius:9px;background:var(--red);color:#fff;font-size:17px;font-weight:800;width:100%;padding:15px;margin-top:22px;cursor:pointer}.message{min-height:22px;text-align:center;color:var(--muted)}.hidden{display:none}@media(max-width:650px){header{gap:15px}nav{gap:12px}nav button{font-size:12px}.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="brand"><b>PDF</b> Tools</div><nav><button data-tool="merge">Merge PDF</button><button data-tool="split">Split PDF</button><button data-tool="compress">Compress PDF</button></nav></header><main><section class="hero"><h1>Every PDF task,<br><em>in one place.</em></h1><p>Private PDF tools powered by your local Python server. Files are not stored after processing.</p></section><section class="grid"><button class="tile" data-tool="merge"><span class="icon">↔</span><h2>Merge PDF</h2><p>Combine PDFs in the order you choose.</p></button><button class="tile" data-tool="split"><span class="icon">↗</span><h2>Split PDF</h2><p>Extract selected page ranges.</p></button><button class="tile" data-tool="compress"><span class="icon">↓</span><h2>Compress PDF</h2><p>Reduce scanned PDF size with four quality levels.</p></button></section><section id="panel" class="panel hidden"><h2 id="title"></h2><label id="drop" class="drop">Choose PDF file(s)<input id="files" type="file" accept="application/pdf" multiple></label><p id="fileLabel"></p><div id="splitOptions" class="hidden"><label>Page ranges (example: 1-10, 15-20)</label><div class="range"><input id="ranges" value="1-1"><span id="pageCount"></span></div></div><div id="qualityOptions" class="hidden"><label>Compression quality<select id="quality"><option value="small">Smallest file</option><option value="balanced" selected>Balanced</option><option value="best">Best quality</option><option value="ultra">Ultra clarity (larger output)</option></select></label></div><button id="submit" class="primary">Process PDF</button><p id="message" class="message"></p></section></main><script>
let mode='',pages=0;const $=id=>document.getElementById(id);const buttons=document.querySelectorAll('[data-tool]');buttons.forEach(b=>b.onclick=()=>openTool(b.dataset.tool));function openTool(next){mode=next;$('panel').classList.remove('hidden');$('title').textContent=next[0].toUpperCase()+next.slice(1)+' PDF';$('files').multiple=next==='merge';$('drop').firstChild.textContent=next==='merge'?'Choose two or more PDF files':'Choose PDF file';$('fileLabel').textContent=next==='merge'?'Tip: hold Ctrl while choosing files, or select multiple files in the chooser.':'';$('splitOptions').classList.toggle('hidden',next!=='split');$('qualityOptions').classList.toggle('hidden',next!=='compress');$('submit').textContent=next[0].toUpperCase()+next.slice(1)+' PDF';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tool===next));$('panel').scrollIntoView({behavior:'smooth'})}$('files').onchange=async()=>{const files=$('files').files;$('fileLabel').textContent=[...files].map(f=>f.name).join(', ');if(mode==='split'&&files[0]){const form=new FormData();form.append('file',files[0]);const data=await fetch('/api/info',{method:'POST',body:form}).then(r=>r.json());pages=data.pages||0;$('ranges').value=`1-${pages}`;$('pageCount').textContent=`${pages} pages found`}};$('submit').onclick=async()=>{const files=$('files').files;if(!files.length)return show('Choose a PDF first.');if(mode==='merge'&&files.length<2)return show('Merge needs at least two PDF files. Hold Ctrl while selecting files.');const form=new FormData();if(mode==='merge')[...files].forEach(f=>form.append('files',f));else form.append('file',files[0]);if(mode==='split')form.append('ranges',$('ranges').value);if(mode==='compress')form.append('quality',$('quality').value);try{show('Processing…');const response=await fetch('/api/'+mode,{method:'POST',body:form});if(!response.ok){const data=await response.json();return show(data.error||'Could not process the PDF.')}const blob=await response.blob(),a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:mode+'.pdf'});a.click();show('Done — download started.')}catch(error){show('Could not reach the local Python server. Restart app.py and try again.')}}function show(text){$('message').textContent=text}
</script></body></html>
